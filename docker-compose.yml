services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: core_wrk_starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
    ports:
      - '5432:5432'
    volumes:
      - starter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starter -d core_wrk_starter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  starter-postgres-data:
